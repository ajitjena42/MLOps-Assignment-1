[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heartguard"
version = "1.0.0"
description = "HeartGuard — An Observable ML Pipeline for Cardiovascular Risk Assessment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
authors = [
    {name = "Student 2025AE05839", email = "2025ae05839@wilp.bits-pilani.ac.in"}
]
dependencies = [
    "numpy>=1.24.3",
    "pandas>=2.0.3",
    "scikit-learn>=1.3.2",
    "joblib>=1.3.2",
    "scipy>=1.11.0",
    "matplotlib>=3.7.5",
    "seaborn>=0.13.0",
    "reportlab>=4.1.0",
    "mlflow>=2.11.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "prometheus-client>=0.20.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".git", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
