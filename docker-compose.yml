version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: heart-disease-api:latest
    container_name: heart-disease-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - mlops-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: heart-disease-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mlops-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: heart-disease-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ./monitoring/grafana_dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
